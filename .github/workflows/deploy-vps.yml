name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_RESTART_COMMAND: ${{ secrets.VPS_RESTART_COMMAND }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://haptokids.fr
        run: |
          npm ci
          npm run build

      - name: Validate backend install
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Configure SSH
        run: |
          test -n "${VPS_HOST}"
          test -n "${VPS_PORT}"
          test -n "${VPS_USER}"
          test -n "${VPS_APP_DIR}"
          test -n "${VPS_SSH_KEY}"

          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Ensure remote directories exist
        run: |
          ssh -i ~/.ssh/id_rsa -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '${VPS_APP_DIR}/frontend/dist' '${VPS_APP_DIR}/backend'"

      - name: Upload frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_rsa -p ${VPS_PORT}" \
            frontend/dist/ \
            "${VPS_USER}@${VPS_HOST}:${VPS_APP_DIR}/frontend/dist/"

      - name: Upload backend source
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude .env.* \
            -e "ssh -i ~/.ssh/id_rsa -p ${VPS_PORT}" \
            backend/ \
            "${VPS_USER}@${VPS_HOST}:${VPS_APP_DIR}/backend/"

      - name: Install backend dependencies and restart app
        run: |
          ssh -i ~/.ssh/id_rsa -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
          "APP_DIR=$(printf '%q' "${VPS_APP_DIR}") RESTART_COMMAND=$(printf '%q' "${VPS_RESTART_COMMAND}") bash -s" \
          < ./scripts/deploy/vps-backend-deploy.sh
