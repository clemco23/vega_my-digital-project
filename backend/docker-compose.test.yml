services:
  postgres-test:
    image: postgres:16
    container_name: hapto-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hapto_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hapto_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - hapto-postgres-test-data:/var/lib/postgresql/data

volumes:
  hapto-postgres-test-data:
